[workspace]
resolver = "2"
members = [
    "crates/radha-app",
    "crates/radha-core",
    "crates/radha-layouts",
    "crates/radha-content",
    "crates/radha-db",
    "crates/radha-analytics",
    "crates/radha-exams",
    "tools/import-golu-content",
]

# ---------------------------------------------------------------------------
# Shared package metadata — inherited by every crate via `x.workspace = true`
# ---------------------------------------------------------------------------
[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
authors = ["Radha Typing Tutor"]
license = "Proprietary"
publish = false

# ---------------------------------------------------------------------------
# Shared dependency versions — single source of truth for the whole workspace
# ---------------------------------------------------------------------------
[workspace.dependencies]
# Internal crates
radha-core = { path = "crates/radha-core" }
radha-layouts = { path = "crates/radha-layouts" }
radha-content = { path = "crates/radha-content" }
radha-db = { path = "crates/radha-db" }
radha-analytics = { path = "crates/radha-analytics" }
radha-exams = { path = "crates/radha-exams" }

# Error handling (Task 3)
thiserror = "1.0.69"
anyhow = "1.0.95"

# Logging (Task 2)
log = "0.4.25"
env_logger = "0.11.6"

# Settings / serialization (Task 4)
serde = { version = "1.0.217", features = ["derive"] }
toml = "0.8.19"

# Database (Task 5)
rusqlite = { version = "0.32.1", features = ["bundled"] }

# Platform paths (Tasks 2, 4, 5)
directories = "5.0.1"

# UI (Tasks 6-11)
slint = "1.9.2"
slint-build = "1.9.2"

# Dev/test
tempfile = "3.15.0"

# ---------------------------------------------------------------------------
# Build profiles (Task 2)
# Tuned for low-end Windows PCs per PRD.md Section 3:
# 2GB RAM, dual-core 1.5GHz, integrated graphics, <20MB binary, <2s startup.
# ---------------------------------------------------------------------------

[profile.dev]
# Keep debug builds fast to iterate on. Debug info is kept for the workspace
# but dependencies are lightly optimised so the UI stays usable when testing.
opt-level = 0
debug = true
incremental = true
codegen-units = 256

[profile.dev.package."*"]
# Optimise third-party deps even in debug: Slint's renderer is unusably slow
# at opt-level 0, which would make design-system work impossible to evaluate.
opt-level = 2

[profile.release]
# `opt-level = 3` is chosen over `"s"` deliberately: the PRD's hard constraint
# is <1ms keystroke latency and 60fps on integrated graphics, so runtime speed
# outranks raw binary size. `lto` + `strip` + `codegen-units = 1` recover most
# of the size difference, keeping us within the <20MB budget.
opt-level = 3
lto = true
codegen-units = 1
strip = true
panic = "abort"
debug = false
incremental = false

# Per-package size exception (keeps the exe under the 20MB budget): crates that
# are NOT on the keystroke or render hot path (app glue + generated UI code,
# startup/IO: compression, hashing, SQLite, config, logging, image decoding)
# build with "s". radha-core, radha-layouts and every slint/i-slint-* crate
# keep opt-level 3.
[profile.release.package.radha-app]
opt-level = "s"
[profile.release.package.miniz_oxide]
opt-level = "s"
[profile.release.package.sha2]
opt-level = "s"
[profile.release.package.rusqlite]
opt-level = "s"
[profile.release.package.libsqlite3-sys]
opt-level = "s"
[profile.release.package.toml]
opt-level = "s"
[profile.release.package.toml_edit]
opt-level = "s"
[profile.release.package.toml_parser]
opt-level = "s"
[profile.release.package.toml_writer]
opt-level = "s"
[profile.release.package.serde_json]
opt-level = "s"
[profile.release.package.env_logger]
opt-level = "s"
[profile.release.package.regex]
opt-level = "s"
[profile.release.package.regex-automata]
opt-level = "s"
[profile.release.package.regex-syntax]
opt-level = "s"
[profile.release.package.directories]
opt-level = "s"
[profile.release.package.image]
opt-level = "s"
[profile.release.package.png]
opt-level = "s"
[profile.release.package.gif]
opt-level = "s"
[profile.release.package.image-webp]
opt-level = "s"
[profile.release.package.zune-jpeg]
opt-level = "s"
# Screen-change / startup only (database, aggregates, content loading,
# compression, date formatting): never on the keystroke or render path.
[profile.release.package.radha-db]
opt-level = "s"
[profile.release.package.radha-analytics]
opt-level = "s"
[profile.release.package.radha-content]
opt-level = "s"
# Exam profiles: parsed once at startup, scored once per result.
[profile.release.package.radha-exams]
opt-level = "s"
[profile.release.package.flate2]
opt-level = "s"
[profile.release.package.crc32fast]
opt-level = "s"
[profile.release.package.chrono]
opt-level = "s"

[profile.release-debuginfo]
# Release-speed build that keeps symbols, for profiling on low-end hardware.
inherits = "release"
strip = false
debug = 1

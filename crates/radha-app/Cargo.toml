[package]
name = "radha-app"
description = "Radha Typing Tutor — Windows desktop application (Slint UI)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "radha-typing-tutor"
path = "src/main.rs"

[dependencies]
# Internal crates. Wired now so later phases add calls, not dependencies.
radha-core.workspace = true
radha-layouts.workspace = true
radha-content.workspace = true
radha-db.workspace = true
radha-analytics.workspace = true

# App boundary uses anyhow for context-rich bubbling (Task 3).
anyhow.workspace = true

log.workspace = true
env_logger.workspace = true
serde.workspace = true
toml.workspace = true
directories.workspace = true
slint.workspace = true

[build-dependencies]
slint-build.workspace = true

[dev-dependencies]
tempfile.workspace = true
